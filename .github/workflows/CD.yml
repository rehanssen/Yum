name: Assemble release and deploy to Firebase

on:
  push:
    branches: "main"

jobs:
  assemble:
    
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Set up Firebase credentials
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

    - name: Set up Android signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

    - name: Verify keystore
      run: |
        test -s "$RUNNER_TEMP/release-key.jks"

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build release
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VERSION_CODE: ${{ github.run_number }}
      run: ./gradlew appDistributionUploadRelease
        
